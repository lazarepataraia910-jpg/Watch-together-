<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Together — ოთახი</title>
<meta name="description" content="Watch Together ოთახი — სინქრონული ვიდეო და ჩატი.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Serif+Georgian:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="room-topbar">
  <button class="btn btn-ghost btn-sm" id="leaveBtn" title="ოთახის დატოვება">← ოთახები</button>
  <div class="title">
    <span id="roomNameLabel">იტვირთება…</span>
    <span class="sub" id="viewerCountLabel"></span>
  </div>
</header>

<div class="conn-banner hidden" id="connBanner" role="status">კავშირი გაწყდა — ვცდილობთ ხელახლა დაკავშირებას…</div>

<div class="room-shell">
  <div class="player-col">
    <div class="player-wrap" id="playerWrap">
    <div class="player-frame" id="playerFrame">
      <div class="player-placeholder" id="playerPlaceholder">ვიდეო ჯერ არ არის დამატებული</div>
    </div>

    <div class="viewer-controls hidden" id="viewerControls">
      <button class="pc-btn" id="muteBtn" type="button" title="ხმის გათიშვა" aria-label="ხმის გათიშვა"></button>
      <button class="pc-btn" id="volDownBtn" type="button" title="ხმის დაწევა" aria-label="ხმის დაწევა">−</button>
      <input type="range" id="volumeSlider" min="0" max="100" value="100" aria-label="ხმა">
      <button class="pc-btn" id="volUpBtn" type="button" title="ხმის აწევა" aria-label="ხმის აწევა">+</button>
      <span class="pc-text" id="volumeValue">100%</span>
      <span class="pc-text" id="timeLabel"></span>
      <span class="pc-spacer"></span>
      <button class="pc-btn hidden" id="ccBtn" type="button" title="სუბტიტრები">CC</button>
      <label class="pc-quality hidden" id="qualityWrap" title="ხარისხი">⚙ <select id="qualitySelect" aria-label="ხარისხი"></select></label>
      <button class="pc-btn" id="fullscreenBtn" type="button" title="გადიდება" aria-label="გადიდება"></button>
    </div>
    </div>

    <div class="owner-bar hidden" id="ownerBar">
      <input type="url" id="videoUrlInput" placeholder="ვიდეოს ან ლაივის ბმული: YouTube, Twitch, Vimeo, Kick, .mp4, .m3u8…">
      <button class="btn btn-primary" id="loadVideoBtn">ჩატვირთვა</button>
      <label class="btn btn-ghost" id="fileShareLabel" for="fileShareInput" title="ვიდეო შენი კომპიუტერიდან — ყველას პირდაპირ გადაეცემა">📁 ვიდეოს ატვირთვა</label>
      <input type="file" id="fileShareInput" accept="video/*" class="hidden">
      <button class="btn btn-ghost" id="shareScreenBtn">🖥️ სქრინის გაზიარება</button>
    </div>
    <div class="sync-hint" id="sourceHint"></div>
    <div class="sync-hint" id="syncHint"></div>
    <div class="sync-hint" id="shareHint"></div>
  </div>

  <div class="side-col">
    <div class="panel admins-panel">
      <h3>ადმინები</h3>
      <div class="admins-list" id="adminsList"></div>
    </div>

    <div class="panel participants-panel">
      <h3>ვინც უყურებს</h3>
      <div class="participants-list" id="participantsList"></div>
    </div>

    <div class="panel chat-panel">
      <h3>ჩატი</h3>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="დაწერე რამე…" maxlength="500">
        <button class="btn btn-primary btn-sm" id="chatSendBtn">გაგზავნა</button>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const roomId = params.get('id');
if (!roomId) window.location.href = '/index.html';

document.getElementById('leaveBtn').addEventListener('click', () => {
  window.location.href = '/index.html';
});

let isOwner = false;
let ownerId = null;
let adminIds = [];
let myId = null;
let canControl = false;
let lastVideoState = null;
let lastParticipants = [];
let applyingRemote = false;
let currentSourceType = 'none'; // 'none' | 'youtube' | 'twitch' | 'vimeo' | 'file' | 'embed' | 'screen'
let ytPlayer = null;
let ytReady = false;
let pendingYtLoad = null;
let fileVideoEl = null;
let twitchPlayer = null;
let twitchReady = false;
let pendingTwitchLoad = null;
let vimeoPlayer = null;
let vimeoTime = 0; // cached from Vimeo's timeupdate event, since its getters are async
let vimeoDuration = 0;
let vimeoMuted = false;
let hlsInstance = null;
let currentIsLive = false; // live streams play at the live edge; time sync is skipped for them

// ---------- Screen share (WebRTC, mesh: sharer holds one RTCPeerConnection per viewer) ----------
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
let screenStream = null; // local capture, only set when I'm the sharer
let isSharing = false;
let peerConnections = {}; // viewerSocketId -> RTCPeerConnection, only used when I'm the sharer
let viewerPeerConnection = null; // used when I'm watching someone else's share
let currentSharerSocketId = null;
let currentSharerUsername = null;

const playerFrame = document.getElementById('playerFrame');
const playerPlaceholder = document.getElementById('playerPlaceholder');
const syncHint = document.getElementById('syncHint');
const shareHint = document.getElementById('shareHint');
const shareScreenBtn = document.getElementById('shareScreenBtn');
const sourceHint = document.getElementById('sourceHint');

// ---------- Viewer controls (non-admins): volume, quality, fullscreen — never play/pause/seek ----------
const viewerControls = document.getElementById('viewerControls');
const muteBtn = document.getElementById('muteBtn');
const volumeSlider = document.getElementById('volumeSlider');
const ccBtn = document.getElementById('ccBtn');
const qualitySelect = document.getElementById('qualitySelect');
const qualityWrap = document.getElementById('qualityWrap');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const playerWrap = document.getElementById('playerWrap');
const volumeValue = document.getElementById('volumeValue');
let ccOn = false;

const YT_QUALITY_LABELS = {
  tiny: '144p', small: '240p', medium: '360p', large: '480p', hd720: '720p',
  hd1080: '1080p', hd1440: '1440p', hd2160: '4K', highres: 'მაქს.', auto: 'ავტო',
};

function updateViewerControlsVisibility() {
  const show = ['youtube', 'twitch', 'vimeo', 'file'].includes(currentSourceType)
    || (currentSourceType === 'screen' && !!fileVideoEl);
  viewerControls.classList.toggle('hidden', !show);
  // Admins keep the native player controls at the bottom, so their bar sits below the video instead of over it.
  playerWrap.classList.toggle('overlay', !canControl);
}

const ICONS = {
  volume: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  muted: '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm18.6 6.2-1.4 1.4L17 13.4l-3.2 3.2-1.4-1.4L15.6 12l-3.2-3.2 1.4-1.4L17 10.6l3.2-3.2 1.4 1.4L18.4 12z"/></svg>',
  expand: '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
  shrink: '<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>',
};

function refreshMuteIcon(muted) {
  muteBtn.innerHTML = muted ? ICONS.muted : ICONS.volume;
}
refreshMuteIcon(false);

function setVolumeSlider(v) {
  volumeSlider.value = v;
  volumeValue.textContent = Math.round(v) + '%';
}

function populateQualitySelect(levels, current) {
  if (!levels || !levels.length) {
    qualityWrap.classList.add('hidden');
    return;
  }
  qualitySelect.innerHTML = '';
  levels.forEach((q) => {
    const opt = document.createElement('option');
    opt.value = q;
    opt.textContent = YT_QUALITY_LABELS[q] || q;
    if (q === current) opt.selected = true;
    qualitySelect.appendChild(opt);
  });
  qualityWrap.classList.remove('hidden');
}

function setupViewerControlsForYouTube() {
  updateViewerControlsVisibility();
  ccOn = false;
  ccBtn.classList.remove('hidden');
  ccBtn.classList.remove('active');
  if (!ytPlayer) return;
  refreshMuteIcon(ytPlayer.isMuted());
  setVolumeSlider(ytPlayer.getVolume());
  refreshYouTubeQualities();
}

// Quality levels are only known once the video starts buffering, so this also runs on PLAYING.
function refreshYouTubeQualities() {
  if (!ytPlayer) return;
  const levels = ytPlayer.getAvailableQualityLevels ? ytPlayer.getAvailableQualityLevels() : [];
  populateQualitySelect(levels, ytPlayer.getPlaybackQuality ? ytPlayer.getPlaybackQuality() : null);
}

function setupViewerControlsForTwitch() {
  updateViewerControlsVisibility();
  ccBtn.classList.add('hidden');
  if (!twitchPlayer) return;
  refreshMuteIcon(twitchPlayer.getMuted());
  setVolumeSlider(Math.round((twitchPlayer.getVolume() || 0) * 100));
  refreshTwitchQualities();
}

function refreshTwitchQualities() {
  if (!twitchPlayer) return;
  const qualities = twitchPlayer.getQualities ? twitchPlayer.getQualities() : [];
  const names = qualities.map((q) => (q && (q.group || q.name)) || q).filter(Boolean);
  populateQualitySelect(names, twitchPlayer.getQuality ? twitchPlayer.getQuality() : null);
}

function setupViewerControlsForFile() {
  updateViewerControlsVisibility();
  qualityWrap.classList.add('hidden');
  ccBtn.classList.add('hidden');
  if (!fileVideoEl) return;
  refreshMuteIcon(fileVideoEl.muted);
  setVolumeSlider(Math.round((fileVideoEl.volume == null ? 1 : fileVideoEl.volume) * 100));
}

ccBtn.addEventListener('click', () => {
  if (currentSourceType !== 'youtube' || !ytPlayer) return;
  ccOn = !ccOn;
  if (ccOn) ytPlayer.loadModule('captions'); else ytPlayer.unloadModule('captions');
  ccBtn.classList.toggle('active', ccOn);
});

muteBtn.addEventListener('click', () => {
  if (currentSourceType === 'youtube' && ytPlayer) {
    const nowMuted = !ytPlayer.isMuted();
    if (nowMuted) ytPlayer.mute(); else ytPlayer.unMute();
    refreshMuteIcon(nowMuted);
  } else if (currentSourceType === 'twitch' && twitchPlayer) {
    const nowMuted = !twitchPlayer.getMuted();
    twitchPlayer.setMuted(nowMuted);
    refreshMuteIcon(nowMuted);
  } else if (currentSourceType === 'vimeo' && vimeoPlayer) {
    vimeoMuted = !vimeoMuted;
    vimeoPlayer.setMuted(vimeoMuted).catch(() => {});
    refreshMuteIcon(vimeoMuted);
  } else if (fileVideoEl) {
    fileVideoEl.muted = !fileVideoEl.muted;
    refreshMuteIcon(fileVideoEl.muted);
  }
});

volumeSlider.addEventListener('input', () => {
  const v = Number(volumeSlider.value);
  volumeValue.textContent = v + '%';
  if (currentSourceType === 'youtube' && ytPlayer) {
    ytPlayer.setVolume(v);
    if (v > 0 && ytPlayer.isMuted()) { ytPlayer.unMute(); refreshMuteIcon(false); }
  } else if (currentSourceType === 'twitch' && twitchPlayer) {
    twitchPlayer.setVolume(v / 100);
    if (v > 0 && twitchPlayer.getMuted()) { twitchPlayer.setMuted(false); refreshMuteIcon(false); }
  } else if (currentSourceType === 'vimeo' && vimeoPlayer) {
    vimeoPlayer.setVolume(v / 100).catch(() => {});
    if (v > 0 && vimeoMuted) { vimeoMuted = false; vimeoPlayer.setMuted(false).catch(() => {}); refreshMuteIcon(false); }
  } else if (fileVideoEl) {
    fileVideoEl.volume = v / 100;
    if (v > 0 && fileVideoEl.muted) { fileVideoEl.muted = false; refreshMuteIcon(false); }
  }
});

qualitySelect.addEventListener('change', () => {
  const q = qualitySelect.value;
  if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.setPlaybackQuality) ytPlayer.setPlaybackQuality(q);
  else if (currentSourceType === 'twitch' && twitchPlayer && twitchPlayer.setQuality) twitchPlayer.setQuality(q);
  else if (currentSourceType === 'file' && hlsInstance) hlsInstance.currentLevel = Number(q);
});

function stepVolume(delta) {
  volumeSlider.value = Math.max(0, Math.min(100, Number(volumeSlider.value) + delta));
  volumeSlider.dispatchEvent(new Event('input'));
}
document.getElementById('volDownBtn').addEventListener('click', () => stepVolume(-10));
document.getElementById('volUpBtn').addEventListener('click', () => stepVolume(10));

// Fullscreen the wrapper (not just the video) so the control bar stays usable in fullscreen.
function fullscreenElement() {
  return document.fullscreenElement || document.webkitFullscreenElement;
}
fullscreenBtn.addEventListener('click', () => {
  if (fullscreenElement()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    const req = playerWrap.requestFullscreen || playerWrap.webkitRequestFullscreen;
    if (req) req.call(playerWrap);
  }
});
function refreshFullscreenBtn() {
  const on = !!fullscreenElement();
  fullscreenBtn.innerHTML = on ? ICONS.shrink : ICONS.expand;
  fullscreenBtn.title = on ? 'დაპატარავება' : 'გადიდება';
  fullscreenBtn.setAttribute('aria-label', fullscreenBtn.title);
}
refreshFullscreenBtn();
document.addEventListener('fullscreenchange', refreshFullscreenBtn);
document.addEventListener('webkitfullscreenchange', refreshFullscreenBtn);

// ---------- Time readout (8:24 / 46:35) ----------
const timeLabel = document.getElementById('timeLabel');
function formatTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
}
setInterval(() => {
  let cur = 0, dur = 0;
  try {
    if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) { cur = ytPlayer.getCurrentTime(); dur = ytPlayer.getDuration(); }
    else if (currentSourceType === 'twitch' && twitchPlayer) { cur = twitchPlayer.getCurrentTime(); dur = twitchPlayer.getDuration(); }
    else if (currentSourceType === 'vimeo') { cur = vimeoTime; dur = vimeoDuration; }
    else if (currentSourceType === 'file' && fileVideoEl) { cur = fileVideoEl.currentTime; dur = fileVideoEl.duration; }
  } catch {}
  // Live streams report no finite duration.
  timeLabel.textContent = isFinite(dur) && dur > 0 && !currentIsLive ? `${formatTime(cur)} / ${formatTime(dur)}`
    : currentIsLive || currentSourceType === 'twitch' ? '● LIVE' : '';
}, 500);

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

const TWITCH_RESERVED_PATHS = ['videos', 'directory', 'p', 'settings', 'subscriptions', 'wallet', 'downloads'];

const VIDEO_FILE_RE = /\.(mp4|webm|ogv|ogg|mov|m4v|mkv)(?:[?#]|$)/i;

function parseVideoUrl(url) {
  if (!url) return { type: 'none' };
  // Only web links: anything else (javascript:, data:, …) would run inside everyone's page.
  if (!/^https?:\/\//i.test(url)) return { type: 'invalid' };
  const yt = url.match(/(?:youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if (yt) return { type: 'youtube', id: yt[1] };
  const twitchVod = url.match(/twitch\.tv\/(?:videos\/|[^/?#]+\/video(?:s)?\/)(\d+)/);
  if (twitchVod) return { type: 'twitch-vod', id: twitchVod[1] };
  const twitchLive = url.match(/twitch\.tv\/([a-zA-Z0-9_]{3,25})\/?(?:[?#].*)?$/);
  if (twitchLive && !TWITCH_RESERVED_PATHS.includes(twitchLive[1].toLowerCase())) {
    return { type: 'twitch-live', channel: twitchLive[1] };
  }
  const vimeo = url.match(/vimeo\.com\/(?:video\/|channels\/[\w-]+\/|groups\/[\w-]+\/videos\/)?(\d+)/i);
  if (vimeo) return { type: 'vimeo', id: vimeo[1] };
  if (/\.m3u8(?:[?#]|$)/i.test(url)) return { type: 'hls', url };
  if (VIDEO_FILE_RE.test(url)) return { type: 'file', url };

  // Sites without a controllable player API: embed their own player (no time sync).
  const kickVod = url.match(/kick\.com\/[\w-]+\/videos\/([\w-]+)/i);
  if (kickVod) return { type: 'embed', src: `https://player.kick.com/video/${kickVod[1]}` };
  const kick = url.match(/kick\.com\/([\w-]+)\/?(?:[?#].*)?$/i);
  if (kick) return { type: 'embed', src: `https://player.kick.com/${kick[1]}` };
  const dm = url.match(/(?:dailymotion\.com\/(?:embed\/)?video\/|dai\.ly\/)([a-z0-9]+)/i);
  if (dm) return { type: 'embed', src: `https://www.dailymotion.com/embed/video/${dm[1]}` };
  if (/(?:facebook\.com|fb\.watch)\//i.test(url)) {
    return { type: 'embed', src: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false` };
  }
  const drive = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/i);
  if (drive) return { type: 'embed', src: `https://drive.google.com/file/d/${drive[1]}/preview` };

  // Unknown link: try it as a direct video first, and embed the page if that fails.
  return { type: 'file', url, fallbackEmbed: true };
}

function showPlayerError(text) {
  destroyPlayer();
  currentSourceType = 'none';
  const div = document.createElement('div');
  div.className = 'player-placeholder';
  div.textContent = text;
  playerFrame.appendChild(div);
}

function youtubeErrorMessage(code) {
  const messages = {
    2: 'ვიდეოს ბმული არასწორია.',
    5: 'ვიდეო ვერ ჩაიტვირთა (დაკვრის შეცდომა).',
    100: 'ვიდეო ვერ მოიძებნა — შესაძლოა წაშლილია ან პირადია.',
    101: 'ამ ვიდეოს ავტორმა დაბლოკა მისი ჩვენება სხვა საიტებზე.',
    150: 'ამ ვიდეოს ავტორმა დაბლოკა მისი ჩვენება სხვა საიტებზე.',
  };
  return messages[code] || 'ვიდეოს ჩატვირთვა ვერ მოხერხდა.';
}

// ---------- Player: builds a YouTube/Twitch iframe player or an HTML5 <video> ----------
function destroyPlayer() {
  if (ytPlayer && ytPlayer.destroy) {
    try { ytPlayer.destroy(); } catch {}
  }
  if (twitchPlayer) {
    try { twitchPlayer.pause(); } catch {}
  }
  if (vimeoPlayer) {
    try { vimeoPlayer.destroy(); } catch {}
  }
  if (hlsInstance) {
    try { hlsInstance.destroy(); } catch {}
  }
  ytPlayer = null;
  twitchPlayer = null;
  vimeoPlayer = null;
  hlsInstance = null;
  fileVideoEl = null;
  currentIsLive = false;
  sourceHint.textContent = '';
  playerFrame.innerHTML = '';
  viewerControls.classList.add('hidden');
}

const scriptLoads = {};
function loadScript(src) {
  if (!scriptLoads[src]) {
    scriptLoads[src] = new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = src;
      tag.onload = resolve;
      tag.onerror = () => { delete scriptLoads[src]; reject(new Error('load failed')); };
      document.head.appendChild(tag);
    });
  }
  return scriptLoads[src];
}

// Sends a play/pause/seek/sync with the position and the (server-clock) moment it was true.
function emitVideo(event, time) {
  socket.emit(event, { time, at: serverNow() });
}

function loadYouTubeApiIfNeeded() {
  if (window.YT && window.YT.Player) {
    ytReady = true;
    return;
  }
  if (document.getElementById('yt-iframe-api')) return;
  const tag = document.createElement('script');
  tag.id = 'yt-iframe-api';
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
  window.onYouTubeIframeAPIReady = () => {
    ytReady = true;
    if (pendingYtLoad) {
      const { id, video } = pendingYtLoad;
      pendingYtLoad = null;
      buildYouTubePlayer(id, video);
    }
  };
}

function buildYouTubePlayer(videoId, initialVideoState) {
  destroyPlayer();
  currentSourceType = 'youtube';
  updateViewerControlsVisibility();
  const holder = document.createElement('div');
  holder.id = 'ytHolder';
  playerFrame.appendChild(holder);

  ytPlayer = new YT.Player('ytHolder', {
    videoId,
    playerVars: {
      autoplay: 0, playsinline: 1, rel: 0, iv_load_policy: 3,
      controls: canControl ? 1 : 0, disablekb: canControl ? 0 : 1, fs: canControl ? 1 : 0,
    },
    events: {
      onReady: () => {
        applyRemoteVideoState(initialVideoState, true);
        setupViewerControlsForYouTube();
      },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) refreshYouTubeQualities();
        if (!canControl || applyingRemote) return;
        if (e.data === YT.PlayerState.PLAYING) {
          emitVideo('video:play', ytPlayer.getCurrentTime());
        } else if (e.data === YT.PlayerState.PAUSED) {
          emitVideo('video:pause', ytPlayer.getCurrentTime());
        }
      },
      onError: (e) => showPlayerError(youtubeErrorMessage(e.data)),
    },
  });
}

function loadTwitchApiIfNeeded() {
  if (window.Twitch && window.Twitch.Player) {
    twitchReady = true;
    return;
  }
  if (document.getElementById('twitch-embed-api')) return;
  const tag = document.createElement('script');
  tag.id = 'twitch-embed-api';
  tag.src = 'https://embed.twitch.tv/embed/v1.js';
  tag.onload = () => {
    twitchReady = true;
    if (pendingTwitchLoad) {
      const load = pendingTwitchLoad;
      pendingTwitchLoad = null;
      load();
    }
  };
  tag.onerror = () => showPlayerError('Twitch-ის პლეიერი ვერ ჩაიტვირთა.');
  document.head.appendChild(tag);
}

function buildTwitchPlayer(parsed, initialVideoState) {
  destroyPlayer();
  currentSourceType = 'twitch';
  updateViewerControlsVisibility();
  const holder = document.createElement('div');
  holder.id = 'twitchHolder';
  holder.style.position = 'relative';
  playerFrame.appendChild(holder);

  currentIsLive = parsed.type === 'twitch-live';
  const options = { width: '100%', height: '100%', parent: [window.location.hostname], autoplay: false };
  if (parsed.type === 'twitch-vod') options.video = parsed.id;
  else options.channel = parsed.channel;

  twitchPlayer = new Twitch.Player('twitchHolder', options);

  // Twitch's embed has no option to hide its native controls, so for non-admins we
  // block all pointer interaction with the iframe and drive it only through our own
  // viewer-controls bar (mute/volume/quality/fullscreen), which uses the JS API directly.
  if (!canControl) {
    const blocker = document.createElement('div');
    blocker.className = 'twitch-click-blocker';
    holder.appendChild(blocker);
  }

  twitchPlayer.addEventListener(Twitch.Player.READY, () => {
    if (parsed.type === 'twitch-vod') applyRemoteVideoState(initialVideoState, true);
    setupViewerControlsForTwitch();
  });
  twitchPlayer.addEventListener(Twitch.Player.PLAYING, refreshTwitchQualities);
  if (parsed.type === 'twitch-vod') {
    twitchPlayer.addEventListener(Twitch.Player.PLAY, () => {
      if (!canControl || applyingRemote || !twitchPlayer) return;
      emitVideo('video:play', twitchPlayer.getCurrentTime());
    });
    twitchPlayer.addEventListener(Twitch.Player.PAUSE, () => {
      if (!canControl || applyingRemote || !twitchPlayer) return;
      emitVideo('video:pause', twitchPlayer.getCurrentTime());
    });
  }
}

const HLS_JS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.20/hls.min.js';

// <video> player for direct files (.mp4/.webm/…) and HLS (.m3u8) streams.
function buildFilePlayer(parsed, initialVideoState) {
  destroyPlayer();
  currentSourceType = 'file';
  updateViewerControlsVisibility();
  const video = document.createElement('video');
  video.controls = canControl;
  video.playsInline = true;
  video.preload = 'auto';
  fileVideoEl = video;
  playerFrame.appendChild(video);

  const failed = () => {
    if (fileVideoEl !== video) return;
    if (parsed.fallbackEmbed) buildEmbedPlayer({ src: parsed.url, generic: true });
    else showPlayerError('ვიდეო ვერ ჩაიტვირთა — ბმული არ მუშაობს ან საიტი ბლოკავს ჩვენებას.');
  };
  video.addEventListener('error', failed);
  video.addEventListener('loadedmetadata', () => {
    currentIsLive = !isFinite(video.duration);
    setupViewerControlsForFile();
    applyRemoteVideoState(initialVideoState, true);
  });
  video.addEventListener('play', () => {
    if (!canControl || applyingRemote) return;
    emitVideo('video:play', video.currentTime);
  });
  video.addEventListener('pause', () => {
    if (!canControl || applyingRemote) return;
    emitVideo('video:pause', video.currentTime);
  });
  let seekDebounce = null;
  video.addEventListener('seeked', () => {
    if (!canControl || applyingRemote) return;
    clearTimeout(seekDebounce);
    seekDebounce = setTimeout(() => emitVideo('video:seek', video.currentTime), 150);
  });

  if (parsed.type === 'hls' && !video.canPlayType('application/vnd.apple.mpegurl')) {
    loadScript(HLS_JS_SRC).then(() => {
      if (fileVideoEl !== video) return;
      if (!window.Hls || !Hls.isSupported()) return failed();
      const hls = new Hls();
      hlsInstance = hls;
      hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
        if (data.levels.length < 2) return;
        populateQualitySelect(['-1', ...data.levels.map((_l, i) => String(i))], '-1');
        [...qualitySelect.options].forEach((o) => {
          const l = data.levels[Number(o.value)];
          o.textContent = l ? (l.height ? l.height + 'p' : 'დონე ' + (Number(o.value) + 1)) : 'ავტო';
        });
      });
      hls.on(Hls.Events.ERROR, (_e, data) => { if (data.fatal) failed(); });
      hls.loadSource(parsed.url);
      hls.attachMedia(video);
    }).catch(failed);
  } else {
    video.src = parsed.url;
  }
}

function buildVimeoPlayer(id, initialVideoState) {
  destroyPlayer();
  currentSourceType = 'vimeo';
  vimeoTime = 0;
  vimeoDuration = 0;
  vimeoMuted = false;
  const holder = document.createElement('div');
  holder.style.position = 'relative';
  playerFrame.appendChild(holder);
  loadScript('https://player.vimeo.com/api/player.js').then(() => {
    if (currentSourceType !== 'vimeo' || !holder.isConnected) return;
    const player = new Vimeo.Player(holder, { id: Number(id), controls: canControl, autoplay: false, playsinline: true, dnt: true });
    vimeoPlayer = player;
    if (!canControl) {
      const blocker = document.createElement('div');
      blocker.className = 'twitch-click-blocker';
      holder.appendChild(blocker);
    }
    player.on('timeupdate', (d) => { vimeoTime = d.seconds; vimeoDuration = d.duration; });
    player.on('play', (d) => { if (canControl && !applyingRemote) emitVideo('video:play', d.seconds); });
    player.on('pause', (d) => { if (canControl && !applyingRemote) emitVideo('video:pause', d.seconds); });
    player.on('seeked', (d) => { if (canControl && !applyingRemote) emitVideo('video:seek', d.seconds); });
    player.ready().then(() => {
      if (vimeoPlayer !== player) return;
      player.getDuration().then((d) => { vimeoDuration = d; }).catch(() => {});
      player.getVolume().then((v) => setVolumeSlider(Math.round(v * 100))).catch(() => {});
      refreshMuteIcon(false);
      qualityWrap.classList.add('hidden');
      ccBtn.classList.add('hidden');
      updateViewerControlsVisibility();
      applyRemoteVideoState(initialVideoState, true);
    }).catch(() => showPlayerError('Vimeo-ს ვიდეო ვერ ჩაიტვირთა — შესაძლოა პირადია ან ჩაშენება აკრძალულია.'));
  }).catch(() => showPlayerError('Vimeo-ს პლეიერი ვერ ჩაიტვირთა.'));
}

// Plain iframe for sites whose player we can't control (Kick, Facebook, Dailymotion, Drive, other pages).
function buildEmbedPlayer(parsed) {
  destroyPlayer();
  currentSourceType = 'embed';
  const iframe = document.createElement('iframe');
  iframe.src = parsed.src;
  iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  // Unknown pages are sandboxed so they can't navigate this tab away.
  if (parsed.generic) iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-forms');
  playerFrame.appendChild(iframe);
  sourceHint.textContent = parsed.generic
    ? 'ეს ბმული პირდაპირი ვიდეო არ არის, ამიტომ გვერდი ჩაშენებულია. თუ ცარიელია, ამ საიტს სხვაგან ჩვენება აკრძალული აქვს. დაკვრა ავტომატურად არ სინქრონდება.'
    : 'ამ საიტის პლეიერს ვერ ვმართავთ — დაკვრა ყველამ თავისთან დააჭიროს (ლაივზე ყველა ერთსა და იმავეს ხედავს).';
}

function setSource(video) {
  const parsed = parseVideoUrl(video.url);
  if (parsed.type === 'none') {
    destroyPlayer();
    currentSourceType = 'none';
    playerFrame.appendChild(playerPlaceholder);
    return;
  }
  playerPlaceholder.remove();
  if (parsed.type === 'youtube') {
    loadYouTubeApiIfNeeded();
    if (ytReady && window.YT && window.YT.Player) {
      buildYouTubePlayer(parsed.id, video);
    } else {
      pendingYtLoad = { id: parsed.id, video };
    }
  } else if (parsed.type === 'twitch-vod' || parsed.type === 'twitch-live') {
    loadTwitchApiIfNeeded();
    if (twitchReady && window.Twitch && window.Twitch.Player) {
      buildTwitchPlayer(parsed, video);
    } else {
      pendingTwitchLoad = () => buildTwitchPlayer(parsed, video);
    }
  } else if (parsed.type === 'vimeo') {
    buildVimeoPlayer(parsed.id, video);
  } else if (parsed.type === 'embed') {
    buildEmbedPlayer(parsed);
  } else if (parsed.type === 'invalid') {
    showPlayerError('ბმული უნდა იწყებოდეს https://-ით.');
  } else {
    buildFilePlayer(parsed, video);
  }
}

// ---------- Screen share ----------
function stopViewerStream() {
  if (viewerPeerConnection) {
    try { viewerPeerConnection.close(); } catch {}
    viewerPeerConnection = null;
  }
  currentSharerSocketId = null;
  currentSharerUsername = null;
}

function stopAllOutgoingPeers() {
  Object.values(peerConnections).forEach((pc) => { try { pc.close(); } catch {} });
  peerConnections = {};
}

const fileShareLabel = document.getElementById('fileShareLabel');
const fileShareInput = document.getElementById('fileShareInput');
let sharedFileUrl = null; // object URL of the local file being streamed, revoked when sharing stops

function updateShareButtonUi() {
  if (!shareScreenBtn) return;
  shareScreenBtn.textContent = isSharing ? '⏹ გაზიარების შეწყვეტა' : '🖥️ სქრინის გაზიარება';
  fileShareLabel.classList.toggle('hidden', isSharing);
}

// Common part of screen share and file share: show the local preview and announce the stream.
function beginSharing(stream, localVideo, hint) {
  stopViewerStream();
  screenStream = stream;
  isSharing = true;
  updateShareButtonUi();
  destroyPlayer();
  currentSourceType = 'screen';
  playerFrame.appendChild(localVideo);
  shareHint.textContent = hint;
  socket.emit('screen:start');
}

async function startScreenShare() {
  if (!canControl || isSharing) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (err) {
    shareHint.textContent = 'სქრინის გაზიარება ვერ დაიწყო — წვდომა უარყოფილია ან გაუქმდა.';
    return;
  }
  const localVideo = document.createElement('video');
  localVideo.autoplay = true;
  localVideo.muted = true;
  localVideo.playsInline = true;
  localVideo.srcObject = stream;
  beginSharing(stream, localVideo, 'შენ აზიარებ სქრინს — ეს გამოსახულება ყველას მიეწოდება.');
  stream.getVideoTracks()[0].addEventListener('ended', stopScreenShare);
}

// "Upload": the file never leaves this computer for a server — it plays here and is streamed
// live to everyone over WebRTC, so any size works and nothing is stored.
async function startFileShare(file) {
  if (!canControl || isSharing || !file) return;
  const localVideo = document.createElement('video');
  const capture = localVideo.captureStream || localVideo.mozCaptureStream;
  if (!capture) {
    shareHint.textContent = 'ეს ბრაუზერი ფაილის გაზიარებას ვერ ახერხებს — გამოიყენე Chrome, Edge ან Firefox.';
    return;
  }
  sharedFileUrl = URL.createObjectURL(file);
  localVideo.src = sharedFileUrl;
  localVideo.controls = true;
  localVideo.playsInline = true;
  try {
    await new Promise((resolve, reject) => {
      localVideo.onloadedmetadata = resolve;
      localVideo.onerror = reject;
    });
  } catch {
    URL.revokeObjectURL(sharedFileUrl);
    sharedFileUrl = null;
    shareHint.textContent = 'ამ ფაილს ბრაუზერი ვერ უკრავს — სცადე .mp4 ან .webm.';
    return;
  }
  const stream = capture.call(localVideo);
  stream.getVideoTracks().forEach((t) => { t.contentHint = 'motion'; });
  beginSharing(stream, localVideo, `შენ აზიარებ „${file.name}“-ს — დაკვრა/გადახვევა აქედან მართე, ყველა იმავეს ხედავს.`);
  fileVideoEl = localVideo;
  updateViewerControlsVisibility();
  setupViewerControlsForFile();
  localVideo.play().catch(() => {});
}

fileShareInput.addEventListener('change', () => {
  const file = fileShareInput.files[0];
  fileShareInput.value = '';
  startFileShare(file);
});

function stopScreenShare() {
  if (!isSharing) return;
  if (screenStream) {
    screenStream.getTracks().forEach((t) => t.stop());
    screenStream = null;
  }
  stopAllOutgoingPeers();
  isSharing = false;
  updateShareButtonUi();
  socket.emit('screen:stop');
  shareHint.textContent = '';
  showPlayerError('გაზიარება დასრულდა.');
  if (sharedFileUrl) { URL.revokeObjectURL(sharedFileUrl); sharedFileUrl = null; }
}

shareScreenBtn.addEventListener('click', () => {
  if (isSharing) stopScreenShare(); else startScreenShare();
});

function watchScreenShare(username) {
  currentSharerUsername = username || null;
  destroyPlayer();
  currentSourceType = 'screen';
  shareHint.textContent = (username ? username + ' აზიარებს' : 'გაზიარება') + ' — იტვირთება…';
  socket.emit('webrtc:request');
}

function showRemoteScreenStream(stream, username) {
  // ontrack fires once per track (video, audio) with the same stream — keep one element.
  if (fileVideoEl && fileVideoEl.srcObject === stream) return;
  destroyPlayer();
  currentSourceType = 'screen';
  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.controls = false;
  video.srcObject = stream;
  playerFrame.appendChild(video);
  fileVideoEl = video;
  updateViewerControlsVisibility();
  setupViewerControlsForFile();
  // Browsers may block sound until the viewer clicks something; start muted rather than not at all.
  video.play().catch(() => {
    video.muted = true;
    refreshMuteIcon(true);
    video.play().catch(() => {});
    shareHint.textContent = 'ხმის ჩასართავად დააჭირე 🔇 ღილაკს ვიდეოს ქვემოთ.';
  });
  shareHint.textContent = username ? `უყურებ ${username}-ის გაზიარებას.` : '';
}

// ---------- Sync ----------
// serverOffset = server clock - this device's clock, measured over the socket (best of a few
// round trips). All "position X at moment T" math uses the server clock, so devices whose
// clocks are a few seconds off still land on the same frame.
let serverOffset = 0;
function serverNow() { return Date.now() + serverOffset; }
async function measureClock() {
  let best = null;
  for (let i = 0; i < 5; i++) {
    const t0 = Date.now();
    const serverTime = await new Promise((resolve) => socket.timeout(3000).emit('time:ping', (err, t) => resolve(err ? null : t)));
    const t1 = Date.now();
    if (serverTime == null) continue;
    const rtt = t1 - t0;
    if (!best || rtt < best.rtt) best = { rtt, offset: serverTime - (t0 + t1) / 2 };
  }
  if (best) serverOffset = best.offset;
}

function estimateCurrentTime(video) {
  if (!video.playing) return video.time;
  const elapsed = (serverNow() - video.updatedAt) / 1000;
  return video.time + Math.max(0, elapsed);
}

const SEEK_DRIFT = 1.0; // seconds off before a player is hard-seeked (iframe players)
const FILE_SEEK_DRIFT = 2.0; // <video> fixes smaller drift by briefly speeding up/slowing down

function applyRemoteVideoState(video, isInitial) {
  if (!video || currentSourceType === 'none' || currentSourceType === 'embed' || currentSourceType === 'screen') return;
  applyingRemote = true;
  const target = estimateCurrentTime(video);

  // A fresh, never-played room starts paused at time 0 — leave the player in its natural
  // cued state (thumbnail + play button) instead of forcing seek/pause, which can leave
  // YouTube's iframe rendering solid black before it has ever buffered a frame.
  const isPristine = isInitial && !video.playing && target < 1;
  // Live streams: everyone watches the live edge, so only play/pause is mirrored.
  const syncTime = !currentIsLive;

  if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.seekTo) {
    if (!isPristine) {
      const cur = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
      if (syncTime && (Math.abs(cur - target) > SEEK_DRIFT || isInitial)) ytPlayer.seekTo(target, true);
      if (video.playing) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
    }
  } else if (currentSourceType === 'twitch' && twitchPlayer && twitchPlayer.seek) {
    if (!isPristine) {
      const cur = twitchPlayer.getCurrentTime ? twitchPlayer.getCurrentTime() : 0;
      if (syncTime && (Math.abs(cur - target) > SEEK_DRIFT || isInitial)) twitchPlayer.seek(target);
      if (video.playing) twitchPlayer.play(); else twitchPlayer.pause();
    }
  } else if (currentSourceType === 'vimeo' && vimeoPlayer) {
    if (!isPristine) {
      if (syncTime && (Math.abs(vimeoTime - target) > SEEK_DRIFT || isInitial)) vimeoPlayer.setCurrentTime(target).catch(() => {});
      (video.playing ? vimeoPlayer.play() : vimeoPlayer.pause()).catch(() => {});
    }
  } else if (currentSourceType === 'file' && fileVideoEl) {
    const v = fileVideoEl;
    const drift = target - v.currentTime;
    if (syncTime) {
      if (isInitial || Math.abs(drift) > FILE_SEEK_DRIFT) {
        v.currentTime = target;
        v.playbackRate = 1;
      } else if (video.playing && Math.abs(drift) > 0.15) {
        // Catch up/slow down by up to 8% until the next sync — invisible, unlike a seek.
        v.playbackRate = 1 + Math.max(-0.08, Math.min(0.08, drift * 0.25));
      } else {
        v.playbackRate = 1;
      }
    }
    if (video.playing) v.play().catch(() => {}); else { v.pause(); v.playbackRate = 1; }
  }

  if (video.playing && !canControl) setTimeout(ensurePlaying, 1500);
  setTimeout(() => { applyingRemote = false; }, 400);
}

// If the browser blocked autoplay with sound, fall back to muted playback so the viewer at least
// stays in sync; one click on the speaker button turns sound back on.
function ensurePlaying() {
  if (!lastVideoState || !lastVideoState.playing) return;
  if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
    const st = ytPlayer.getPlayerState();
    if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
      ytPlayer.mute();
      ytPlayer.playVideo();
      refreshMuteIcon(true);
      sourceHint.textContent = 'ბრაუზერმა ხმა დაბლოკა — ჩასართავად დააჭირე 🔇 ღილაკს.';
    }
  } else if (currentSourceType === 'file' && fileVideoEl && fileVideoEl.paused) {
    fileVideoEl.muted = true;
    fileVideoEl.play().catch(() => {});
    refreshMuteIcon(true);
    sourceHint.textContent = 'ბრაუზერმა ხმა დაბლოკა — ჩასართავად დააჭირე 🔇 ღილაკს.';
  }
}

// The controlling admin reports its position every 2s while playing; the server forwards it
// to viewers, who correct any drift (buffering, slow devices, missed events).
function currentPlayerTime() {
  try {
    if (currentSourceType === 'youtube' && ytPlayer && ytPlayer.getPlayerState) {
      return ytPlayer.getPlayerState() === YT.PlayerState.PLAYING ? ytPlayer.getCurrentTime() : null;
    }
    if (currentSourceType === 'twitch' && twitchPlayer && !currentIsLive) {
      return twitchPlayer.isPaused() ? null : twitchPlayer.getCurrentTime();
    }
    if (currentSourceType === 'vimeo' && vimeoPlayer) return vimeoTime;
    if (currentSourceType === 'file' && fileVideoEl && !currentIsLive) {
      return fileVideoEl.paused ? null : fileVideoEl.currentTime;
    }
  } catch {}
  return null;
}
setInterval(() => {
  if (!canControl || !socket.connected || currentIsLive) return;
  const t = currentPlayerTime();
  if (t != null) emitVideo('video:sync', t);
}, 2000);

// Background tabs throttle timers and players; resync as soon as the tab is visible again.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && lastVideoState) applyRemoteVideoState(lastVideoState, false);
});

// ---------- Socket ----------
const socket = io();

const connBanner = document.getElementById('connBanner');
socket.on('disconnect', () => connBanner.classList.remove('hidden'));
socket.on('connect_error', () => connBanner.classList.remove('hidden'));
socket.on('connect', () => {
  connBanner.classList.add('hidden');
  measureClock();
  socket.emit('room:join', roomId);
});
setInterval(() => { if (socket.connected) measureClock(); }, 60000);

socket.on('room:error', (code) => {
  alert(code === 'NO_ACCESS' ? 'ამ ოთახზე წვდომა არ გაქვს — ჯერ პაროლით შედი დაშბორდიდან.' : 'ოთახი ვერ მოიძებნა.');
  window.location.href = '/index.html';
});

function updateControlUi() {
  document.getElementById('ownerBar').classList.toggle('hidden', !canControl);
  syncHint.textContent = canControl
    ? (isOwner ? 'შენ ხარ მფლობელი.' : 'შენ ხარ ადმინი.')
    : 'დაკვრას მართავენ ადმინები.';
  updateViewerControlsVisibility();
}

socket.on('room:init', (data) => {
  isOwner = data.isOwner;
  ownerId = data.ownerId;
  adminIds = data.admins || [];
  myId = data.me && data.me.id;
  canControl = isOwner || adminIds.includes(myId);
  document.getElementById('roomNameLabel').textContent = data.roomName;
  document.title = data.roomName + ' — Watch Together';
  updateControlUi();
  renderParticipants(data.participants);
  data.chat.forEach(renderChatMessage);
  scrollChatToBottom();
  lastVideoState = data.video;
  if (data.screenSharer) {
    currentSharerSocketId = data.screenSharer.socketId;
    watchScreenShare(data.screenSharer.username);
  } else {
    setSource(data.video);
  }
});

socket.on('room:participants', renderParticipants);

socket.on('room:admins', (admins) => {
  adminIds = admins || [];
  const before = canControl;
  canControl = isOwner || adminIds.includes(myId);
  updateControlUi();
  renderParticipants(lastParticipants);
  if (before !== canControl && lastVideoState) setSource(lastVideoState);
});

socket.on('video:source', (video) => {
  lastVideoState = video;
  stopViewerStream();
  setSource(video);
});
socket.on('video:state', (video) => { lastVideoState = video; applyRemoteVideoState(video, false); });

// ---------- Screen share signaling ----------
socket.on('screen:started', ({ username }) => {
  if (isSharing) return; // I'm the one sharing, ignore my own broadcast
  watchScreenShare(username);
});

socket.on('screen:stopped', () => {
  stopViewerStream();
  shareHint.textContent = '';
  if (isSharing) {
    // our own share got superseded server-side (e.g. we loaded a URL video instead)
    if (screenStream) { screenStream.getTracks().forEach((t) => t.stop()); screenStream = null; }
    stopAllOutgoingPeers();
    isSharing = false;
    updateShareButtonUi();
  } else {
    showPlayerError('გაზიარება დასრულდა.');
  }
});

socket.on('webrtc:request', async ({ viewerSocketId }) => {
  if (!isSharing || !screenStream) return;
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  peerConnections[viewerSocketId] = pc;
  screenStream.getTracks().forEach((track) => pc.addTrack(track, screenStream));
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc:ice-candidate', { to: viewerSocketId, candidate: e.candidate });
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'closed', 'disconnected'].includes(pc.connectionState)) {
      pc.close();
      delete peerConnections[viewerSocketId];
    }
  };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('webrtc:offer', { to: viewerSocketId, sdp: offer });
});

socket.on('webrtc:offer', async ({ from, sdp }) => {
  const sharerName = currentSharerUsername; // stopViewerStream() clears it
  stopViewerStream();
  currentSharerSocketId = from;
  currentSharerUsername = sharerName;
  viewerPeerConnection = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  viewerPeerConnection.ontrack = (e) => {
    showRemoteScreenStream(e.streams[0], currentSharerUsername);
  };
  viewerPeerConnection.onicecandidate = (e) => {
    if (e.candidate) socket.emit('webrtc:ice-candidate', { to: from, candidate: e.candidate });
  };
  await viewerPeerConnection.setRemoteDescription(new RTCSessionDescription(sdp));
  const answer = await viewerPeerConnection.createAnswer();
  await viewerPeerConnection.setLocalDescription(answer);
  socket.emit('webrtc:answer', { to: from, sdp: answer });
});

socket.on('webrtc:answer', async ({ from, sdp }) => {
  const pc = peerConnections[from];
  if (pc) await pc.setRemoteDescription(new RTCSessionDescription(sdp));
});

socket.on('webrtc:ice-candidate', async ({ from, candidate }) => {
  if (!candidate) return;
  const pc = peerConnections[from] || (from === currentSharerSocketId ? viewerPeerConnection : null);
  if (pc) { try { await pc.addIceCandidate(candidate); } catch {} }
});

socket.on('chat:message', (msg) => {
  renderChatMessage(msg);
  scrollChatToBottom();
});

// ---------- Participants & admins ----------
function isRoomAdmin(p) {
  return p.userId === ownerId || adminIds.includes(p.userId);
}

// avatar is a URL the server builds (/api/users/<id>/avatar?v=…), so it is safe to put in src.
function avatarHtml(p) {
  return p.avatar
    ? `<img class="avatar-img" src="${p.avatar}" alt="">`
    : `<span class="avatar-dot">${escapeHtml(p.username[0].toUpperCase())}</span>`;
}

function renderParticipants(list) {
  lastParticipants = list;
  document.getElementById('viewerCountLabel').textContent = '· ' + list.length + ' ონლაინ';

  const adminsEl = document.getElementById('adminsList');
  const admins = list.filter(isRoomAdmin);
  adminsEl.innerHTML = admins.length ? '' : '<div class="empty-state">ჯერ არავინაა</div>';
  admins.forEach((p) => {
    const row = document.createElement('div');
    row.className = 'participant-row';
    const label = p.userId === ownerId ? ' (მფლობელი)' : ' (ადმინი)';
    row.innerHTML = `${avatarHtml(p)}<span>${escapeHtml(p.username)}${label}</span>`;
    adminsEl.appendChild(row);
  });

  const el = document.getElementById('participantsList');
  el.innerHTML = '';
  list.forEach((p) => {
    const row = document.createElement('div');
    row.className = 'participant-row';
    row.innerHTML = `${avatarHtml(p)}<span>${escapeHtml(p.username)}</span>`;
    if (isOwner && p.userId !== myId && !isRoomAdmin(p)) {
      const btn = document.createElement('button');
      btn.className = 'btn btn-ghost btn-sm';
      btn.textContent = 'ადმინად დანიშვნა';
      btn.addEventListener('click', () => socket.emit('room:promote', p.userId));
      row.appendChild(btn);
    }
    el.appendChild(row);
  });
}

// ---------- Chat ----------
function renderChatMessage(msg) {
  const el = document.getElementById('chatMessages');
  const row = document.createElement('div');
  if (msg.system) {
    row.className = 'chat-msg system';
    row.textContent = msg.text;
  } else {
    row.className = 'chat-msg';
    row.innerHTML = `<span class="who">${escapeHtml(msg.username)}</span>${escapeHtml(msg.text)}`;
  }
  el.appendChild(row);
}
function scrollChatToBottom() {
  const el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

const chatInput = document.getElementById('chatInput');
function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  socket.emit('chat:send', text);
  chatInput.value = '';
}
document.getElementById('chatSendBtn').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChat();
});

// ---------- Owner: set video source ----------
document.getElementById('loadVideoBtn').addEventListener('click', () => {
  const url = document.getElementById('videoUrlInput').value.trim();
  if (!url) return;
  socket.emit('video:setSource', url);
});
</script>
